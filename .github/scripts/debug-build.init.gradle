// Build the custom package using the repository's sample signing configuration.
// Firebase push requires a separate registration for this package; do not run
// the application task that validates the original Telegram Firebase package.
gradle.afterProject { project, state ->
    if (project.path == ':TMessagesProj_App') {
        project.android.packagingOptions.jniLibs.excludes.addAll([
            '**/armeabi-v7a/**', '**/x86/**', '**/x86_64/**'
        ])
        // Keep this task in the graph so generated-resource providers resolve.
        // Excluding it with -x prevents AGP's resource tasks from running.
        project.tasks.matching { it.name == 'processAfatDebugGoogleServices' }.configureEach {
            enabled = false
        }
    }
}
