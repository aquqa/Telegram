name: Build Debug APK (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults include the retired SDK package "tools".
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          bash ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --init-script .github/scripts/debug-build.init.gradle \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon --max-workers=4 --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk=TMessagesProj_App/build/intermediates/apk/afat/debug/app.apk
          if [[ ! -f "$apk" ]]; then
            apk=TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          fi
          test -s "$apk"
          mkdir -p artifacts
          cp "$apk" artifacts/whisper-debug-arm64.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify artifacts/whisper-debug-arm64.apk
          "$tools/aapt2" dump badging artifacts/whisper-debug-arm64.apk > artifacts/apk-info.txt
          python3 - <<'PY'
          import pathlib
          import re
          import zipfile

          properties = pathlib.Path('gradle.properties').read_text()
          package = re.search(r'^APP_PACKAGE=(.+)$', properties, re.MULTILINE).group(1).strip()
          badging = pathlib.Path('artifacts/apk-info.txt').read_text()
          assert f"package: name='{package}'" in badging, 'Unexpected APK package'
          assert "application-label:'whisper'" in badging, 'Unexpected app name'
          assert 'application-debuggable' in badging, 'APK is not debuggable'
          with zipfile.ZipFile('artifacts/whisper-debug-arm64.apk') as apk:
              names = apk.namelist()
              abis = {n.split('/')[1] for n in names if n.startswith('lib/') and n.endswith('.so')}
              assert abis == {'arm64-v8a'}, f'Unexpected native architectures: {abis}'
              assert 'lib/arm64-v8a/libtmessages.49.so' in names, 'Missing main native library'
              assert any('whisper_icon_artwork' in n for n in names), 'Missing custom icon'
          PY
          (cd artifacts && sha256sum whisper-debug-arm64.apk > SHA256SUMS.txt)

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whisper-debug-arm64-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
