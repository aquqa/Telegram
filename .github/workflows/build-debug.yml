name: Build APK (ARM64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        type: choice
        default: debug
        options:
          - debug
          - release
          - both

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.build_type }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(inputs.build_type == 'both' && '["debug","release"]' || inputs.build_type == 'release' && '["release"]' || '["debug"]') }}
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare release signing
        if: matrix.build_type == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/whisper-release.jks"
          printf 'RELEASE_KEYSTORE_PATH=%s\n' "$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          required = ['RELEASE_KEYSTORE_BASE64', 'RELEASE_STORE_PASSWORD',
                      'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
          for name in required:
              if not os.environ.get(name):
                  raise SystemExit(f'Missing GitHub Secret: {name}')
          try:
              data = base64.b64decode(''.join(os.environ['RELEASE_KEYSTORE_BASE64'].split()), validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('RELEASE_KEYSTORE_BASE64 is not valid Base64')
          if not data:
              raise SystemExit('Decoded release keystore is empty')
          Path(os.environ['RELEASE_KEYSTORE_PATH']).write_bytes(data)
          PY
          keytool -exportcert \
            -keystore "$RELEASE_KEYSTORE_PATH" \
            -storepass:env RELEASE_STORE_PASSWORD \
            -alias "$RELEASE_KEY_ALIAS" \
            -file "$RUNNER_TEMP/whisper-release.der"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults include the retired SDK package "tools".
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          RELEASE_STORE_PASSWORD: ${{ matrix.build_type == 'release' && secrets.RELEASE_STORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ matrix.build_type == 'release' && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ matrix.build_type == 'release' && secrets.RELEASE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BUILD_TYPE" in
            debug) task=assembleAfatDebug; heap=4g ;;
            release) task=assembleAfatRelease; heap=6g ;;
            *) echo 'Unsupported build type'; exit 1 ;;
          esac
          bash ./gradlew ":TMessagesProj_App:$task" \
            --init-script .github/scripts/build-apk.init.gradle \
            --no-daemon --max-workers=4 --console=plain --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx$heap -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk="TMessagesProj_App/build/outputs/apk/afat/$BUILD_TYPE/app.apk"
          if [[ ! -f "$apk" ]]; then
            apk="TMessagesProj_App/build/intermediates/apk/afat/$BUILD_TYPE/app.apk"
          fi
          test -s "$apk"
          args=("$apk" artifacts "$BUILD_TYPE")
          if [[ "$BUILD_TYPE" == release ]]; then
            args+=(--signing-certificate "$RUNNER_TEMP/whisper-release.der")
          fi
          python3 .github/scripts/verify-apk.py "${args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ matrix.build_type }}-arm64-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove release signing files
        if: always() && matrix.build_type == 'release'
        shell: bash
        run: rm -f "$RUNNER_TEMP/whisper-release.jks" "$RUNNER_TEMP/whisper-release.der"
